# The gateway between Claude Code (Anthropic Messages API) and Cerebras (OpenAI chat completions) for the evaluation.
# Two aliases, one per model under test (qwen falls back to gpt-oss). Every model slot Claude Code has (sonnet, haiku, opus, small-fast) is pointed at the alias
# in TAi's .env, so no request carries a name this file does not know. The live deployment (deploy/cs6650) shares this file and adds a third alias, deepseek.
model_list:
  - model_name: qwen                       # Nora's model, reasoning off (Nora's setting)
    litellm_params:
      model: cerebras/qwen-3.8-27b         # the cerebras/ provider: openai/ would call /v1/responses, which Cerebras does not have
      api_key: os.environ/CEREBRAS_API_KEY
      extra_body:
        reasoning_effort: "none"
        parallel_tool_calls: false             # LiteLLM's streaming /v1/messages translation merges parallel tool calls into ONE block with
                                               # the arguments concatenated (invalid JSON, so Claude Code sees {}); one call per turn avoids it
  - model_name: gpt-oss                    # gpt-oss-120b has no "none": low is the nearest, so the two are not symmetric
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      extra_body:
        reasoning_effort: "low"
        parallel_tool_calls: false

  # DeepSeek's own API (platform.deepseek.com), for the live deployment: used only when TAi is told to (tai_live.sh model deepseek [--background],
  # TAI_VOICE_MODEL=deepseek). It is in NO fallback chain below on purpose: a fallback would send students' words to a provider in another
  # jurisdiction without anyone having decided that. The key arrives as DEEPSEEK_API_KEY from the gateway's env file (tai_credentials.sh deepseek);
  # without it the gateway still starts and a request for this alias fails with 401.
  - model_name: deepseek
    litellm_params:
      model: deepseek/deepseek-flash        # DeepSeek-V4.1-Flash, the id its /models lists (deepseek-chat / deepseek-reasoner are not on its price page any more)
      api_base: https://api.deepseek.com    # pinned: LiteLLM's own default for this provider is the /beta address
      api_key: os.environ/DEEPSEEK_API_KEY
      extra_body:
        thinking:
          type: disabled                    # thinking is ON by default there, and with tools every later request must send the reasoning_content back
                                            # (HTTP 400 otherwise); the text agent and the voice relay always send tools. Nothing else goes in extra_body:
                                            # it reaches DeepSeek unchanged (drop_params does not touch it), so a field it rejects would fail every call

  # z.ai (GLM-5.3-Flash) through the OpenAI chat completions endpoint of the GLM Coding Plan (https://api.z.ai/api/coding/paas/v4): `glm` is GLM-5.3-Flash as a thinking
  # model (tai_live.sh models glm: the owner's token-consumption comparison with deepseek), `glm-vision` is the model that reads a student's pictures (TAI_VISION=1,
  # docs/VISION.md). Like deepseek they are in NO fallback chain: a fallback would send students' words to another provider without anyone having decided that. The key
  # arrives as ZAI_API_KEY from the gateway's env file (tai_credentials.sh zai); without it the gateway still starts and a request for these aliases fails with 401.
  # Why this endpoint and not the Anthropic Messages one (https://api.z.ai/api/anthropic, which answers the same, with the same token use): THINKING. The docs say 5.3-Flash
  # always thinks, but the API accepts `thinking: {type: disabled}` and then does not think (measured 2026-11-05 on the owner's key: the same Nora voice question took 57-86
  # output tokens in 2.2-2.8 s, against 130-260 tokens in 3.6-5.5 s with thinking on). LiteLLM's anthropic/ provider drops "disabled" (it is Anthropic's default, so it sends
  # nothing) and z.ai's default is ON, so through it the model always thought; here the field goes out unchanged in extra_body, as for deepseek, which is also why it is
  # off: with tools every later request would have to send the thinking blocks back.
  # `glm` uses LiteLLM's zai/ provider (2026-11-23, when the live chats moved to it): under openai/ the Anthropic route (/v1/messages, what the text agent sends)
  # called a path the coding endpoint does not have (HTTP 404 Not Found, and the alias then sat in cooldown); zai/ is OpenAI chat completions at the same endpoint, like
  # deepseek/. Measured on a scratch gateway with the owner's key: plain and streamed tool round trips through /v1/messages, two tool calls in one streamed answer
  # as two valid blocks, and the voice relay's /v1/chat/completions round trip, with 3 to 11 output tokens (thinking off). glm-vision is read through chat
  # completions only and stays as it was.
  - model_name: glm
    litellm_params:
      model: zai/glm-5.3-flash
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY
      extra_body:
        thinking:
          type: disabled
  - model_name: glm-vision                   # natively multimodal (docs.z.ai/guides/vlm/glm-5.3-flash: image, video, text, file in, text out); an alias of its own so that a
    litellm_params:                          # different picture model can replace it without touching the thinking model
      model: openai/glm-5.3-flash
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY
      extra_body:
        thinking:
          type: disabled

  # Test alias for eval/harness/fallback.py: a deployment that always fails (Cerebras answers 401) and falls back to gpt-oss as qwen does.
  - model_name: test-bad-key
    litellm_params:
      model: cerebras/qwen-3.8-27b
      api_key: not-a-real-key
      extra_body:
        reasoning_effort: "none"
        parallel_tool_calls: false

litellm_settings:
  drop_params: true
  request_timeout: 300
  callbacks: tai_callbacks.proxy_handler_instance   # strips replayed thinking blocks; logs the upstream status of every call;
                                                    # keeps qwen inside TAi's share of the tokens-per-minute bucket (spills to gpt-oss)

router_settings:
  num_retries: 0        # a 429 from Cerebras must reach the fallback and the log, not be retried out of sight here
  fallbacks:            # gpt-oss backs qwen up when qwen cannot answer (a 429 because Nora used the shared bucket, a 5xx, a timeout)
    - qwen: [gpt-oss]
    - test-bad-key: [gpt-oss]
